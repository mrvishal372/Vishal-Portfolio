    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar-meta" />

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var profileStr = localStorage.getItem('bharatjugaad_user_profile_v1');
          var savedTheme = null;
          if (profileStr) {
            try { savedTheme = JSON.parse(profileStr).theme; } catch (e) {}
          }
          if (!savedTheme) {
            savedTheme = localStorage.getItem('vyron_visitor_theme');
          }
          var isDark = savedTheme === 'dark';
          var color = isDark ? '#020617' : '#ffffff';
          var barStyle = isDark ? 'black-translucent' : 'default';

          var docEl = document.documentElement;
          if (isDark) {
            docEl.classList.add('dark');
            docEl.style.colorScheme = 'dark';
          } else {
            docEl.classList.remove('dark');
            docEl.style.colorScheme = 'light';
          }
          docEl.style.backgroundColor = color;
          if (document.body) document.body.style.backgroundColor = color;

          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', color);
          var appleMeta = document.getElementById('apple-status-bar-meta');
          if (appleMeta) appleMeta.setAttribute('content', barStyle);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-['Poppins',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
